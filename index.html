<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HEAM AI — Твой AI-помощник</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0d15;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

header {
  height: 70px;
  background: #171724;
  border-bottom: 1px solid #303043;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #b395ff;
}

button {
  cursor: pointer;
  border: none;
  font-family: inherit;
}

.new-chat {
  background: #38304d;
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
}

.new-chat:hover {
  background: #504269;
}

main {
  max-width: 900px;
  margin: auto;
  height: calc(100dvh - 70px);
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 25px 18px;
}

.welcome {
  margin-top: 13vh;
  text-align: center;
}

.welcome h1 {
  font-size: 40px;
  color: #b395ff;
}

.welcome p {
  font-size: 17px;
  color: #9c9bb1;
}

.message {
  padding: 15px 20px;
  border-radius: 17px;
  margin: 14px 0;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #604bb1;
  margin-left: auto;
}

.ai {
  background: #242434;
  border: 1px solid #38384c;
}

.thinking {
  color: #b395ff;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

.input-area {
  margin: 14px;
  padding: 12px;
  display: flex;
  gap: 10px;
  background: #1c1c2b;
  border: 1px solid #3c3c52;
  border-radius: 18px;
}

textarea {
  flex: 1;
  background: transparent;
  color: white;
  border: none;
  outline: none;
  resize: none;
  font: 16px Arial;
  padding: 12px;
  min-height: 48px;
}

.send {
  background: #9975ff;
  color: white;
  width: 50px;
  min-width: 50px;
  border-radius: 12px;
  font-size: 22px;
}

.send:hover {
  background: #ab91ff;
}

.send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.note {
  text-align: center;
  color: #88889c;
  font-size: 12px;
  padding: 5px 10px 12px;
}

@media (max-width: 600px) {
  .logo {
    font-size: 20px;
  }

  .welcome h1 {
    font-size: 30px;
  }

  .message {
    max-width: 95%;
  }

  header {
    padding: 0 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ HEAM AI</div>

  <button class="new-chat" onclick="newChat()">
    + Новый чат
  </button>
</header>

<main>

  <div id="messages"></div>

  <div class="input-area">

    <textarea
      id="input"
      placeholder="Спроси HEAM о чём-нибудь..."
      rows="1"
    ></textarea>

    <button
      id="sendButton"
      class="send"
      onclick="sendMessage()"
      aria-label="Отправить"
    >➤</button>

  </div>

  <div class="note">
    HEAM AI ✦ Твой персональный AI-помощник
  </div>

</main>

<script>

const API_URL =
  "https://heam-ai.mykhailo-moholivets.workers.dev/";

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");

let history = [];
let loading = false;
let chatVersion = 0;

try {
  const saved = JSON.parse(
    localStorage.getItem("heam_history") || "[]"
  );

  if (Array.isArray(saved)) {
    history = saved.filter(item =>
      item &&
      (item.role === "user" || item.role === "ai") &&
      typeof item.text === "string"
    );
  }
} catch (error) {
  history = [];
}

function saveHistory() {
  try {
    localStorage.setItem(
      "heam_history",
      JSON.stringify(history)
    );
  } catch (error) {
    console.log("Не удалось сохранить историю.");
  }
}

function addMessage(text, role) {
  const div = document.createElement("div");

  div.className = "message " + role;
  div.textContent = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function render() {
  messages.innerHTML = "";

  if (history.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const title = document.createElement("h1");
    title.textContent = "Привет! Я HEAM AI ✦";

    const subtitle = document.createElement("p");
    subtitle.textContent =
      "Твой персональный AI-помощник";

    welcome.appendChild(title);
    welcome.appendChild(subtitle);
    messages.appendChild(welcome);
  }

  history.forEach(item => {
    addMessage(item.text, item.role);
  });

  if (loading) {
    const thinking = document.createElement("div");

    thinking.className = "message ai thinking";
    thinking.textContent = "✦ HEAM AI думает...";

    messages.appendChild(thinking);
  }

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || loading) return;

  if (text.length > 2000) {
    alert("Сообщение слишком длинное.");
    return;
  }

  input.value = "";
  loading = true;
  sendButton.disabled = true;

  const currentChat = chatVersion;

  history.push({
    role: "user",
    text: text
  });

  saveHistory();
  render();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Ошибка сервера"
      );
    }

    if (currentChat !== chatVersion) return;

    history.push({
      role: "ai",
      text: data.reply ||
        "Не удалось получить ответ."
    });

  } catch (error) {
    if (currentChat !== chatVersion) return;

    console.error("HEAM AI:", error);

    history.push({
      role: "ai",
      text:
        "Не удалось связаться с HEAM AI. " +
        "Попробуй отправить сообщение ещё раз."
    });

  } finally {
    if (currentChat === chatVersion) {
      loading = false;
      sendButton.disabled = false;
      saveHistory();
      render();
      input.focus();
    }
  }
}

function newChat() {
  chatVersion++;
  history = [];
  loading = false;
  sendButton.disabled = false;

  saveHistory();
  render();
  input.focus();
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

render();

</script>

</body>
</html>
